name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --frozen --offline ruff check .
      - name: Format
        run: uv run --frozen --offline ruff format --check .
      - name: Tests without network / keys
        run: uv run --frozen --offline pytest
      - name: Offline demo
        run: uv run --frozen --offline metro-agent demo --offline --output artifacts/ci-demo
      - name: Agent task and retrieval contracts (synthetic, no model calls)
        run: uv run --frozen --offline metro-agent evaluate --output artifacts/ci-evaluation
      - name: Build wheel and source distribution
        run: uv build
      - name: Check installable distribution contents
        run: uv run --frozen --offline python scripts/check_distribution.py
      - name: Check public file policy
        run: uv run --frozen --offline python scripts/check_public_tree.py
